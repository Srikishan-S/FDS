erate</text><text x="710" y="367" font-family="sans-serif" font-size="12" fill="#738d96">EAM · contextual strategy · ranking</text><rect x="370" y="285" width="280" height="110" rx="10" fill="white" stroke="#c8dfdc"/><text x="390" y="313" font-family="sans-serif" font-size="13" fill="#098a78">05</text><text x="390" y="341" font-family="sans-serif" font-size="17" font-weight="600" fill="#244850">Prospective shadow arena</text><text x="390" y="367" font-family="sans-serif" font-size="12" fill="#738d96">Paired future-window F1 and cost</text><rect x="50" y="285" width="280" height="110" rx="10" fill="white" stroke="#c8dfdc"/><text x="70" y="313" font-family="sans-serif" font-size="13" fill="#098a78">06</text><text x="70" y="341" font-family="sans-serif" font-size="17" font-weight="600" fill="#244850">Deploy &amp; remember</text><text x="70" y="367" font-family="sans-serif" font-size="12" fill="#738d96">Version gate · rollback · survival</text><path d="M330 155H366" fill="none" stroke="#418a80" stroke-width="2" marker-end="url(#arrow)"/><path d="M650 155H686" fill="none" stroke="#418a80" stroke-width="2" marker-end="url(#arrow)"/><path d="M830 210V281" fill="none" stroke="#418a80" stroke-width="2" marker-end="url(#arrow)"/><path d="M690 340H654" fill="none" stroke="#418a80" stroke-width="2" marker-end="url(#arrow)"/><path d="M370 340H334" fill="none" stroke="#418a80" stroke-width="2" marker-end="url(#arrow)"/><path d="M190 285V214" fill="none" stroke="#418a80" stroke-width="2" marker-end="url(#arrow)"/><text x="50" y="452" font-family="sans-serif" font-size="14" fill="#62828c">Drift → Fingerprint → Recall → Generate → Evaluate → Adapt → Remember</text></svg>